<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aero">
<meta name="theme-color" content="#3fa9e0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Aero Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#0b6fb8; --sky2:#3fa9e0; --sky3:#a8e3ff; --grass:#6cc644;
  --glass:rgba(255,255,255,.22); --glass-edge:rgba(255,255,255,.65);
  --ink:#06395e; --white:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:Nunito,"Segoe UI",-apple-system,system-ui,sans-serif;
  color:var(--white);min-height:100vh;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(900px 500px at 0% 110%,rgba(120,230,120,.55),transparent 60%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* floating background bubbles */
#bgBubbles{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;overflow:hidden}
#bgBubbles span{position:absolute;bottom:-120px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 8%,rgba(255,255,255,.15) 22%,rgba(255,255,255,.05) 55%,rgba(180,240,255,.35) 72%,rgba(255,255,255,.7) 76%,transparent 78%);
  animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-130vh) translateX(var(--dx))}}

.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 16px 60px}

header{padding:calc(22px + env(safe-area-inset-top)) 0 10px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.orb{width:58px;height:58px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 50% 110%,#b8ff7a 0,#39c24a 35%,#0a8a5a 70%,#05603f 100%);
  box-shadow:0 6px 18px rgba(0,60,90,.35),inset 0 -4px 10px rgba(255,255,255,.35)}
.orb::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:48%;border-radius:50%/60% 60% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.1))}
h1{margin:0;font-weight:900;font-size:48px;font-size:clamp(34px,6vw,58px);letter-spacing:-.5px;
  background:linear-gradient(180deg,#fff 0%,#fff 48%,#d4f3ff 52%,#9fe0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,70,120,.35)) drop-shadow(0 8px 16px rgba(0,50,100,.3))}
.sub{margin:6px 0 0;font-weight:700;opacity:.92;text-shadow:0 1px 3px rgba(0,60,100,.4)}

/* glass pill bar */
.bar{position:sticky;top:0;z-index:5;margin:18px -16px 18px;padding:10px 16px calc(10px);
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.12));
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.35);
  box-shadow:0 8px 24px rgba(0,60,110,.18)}
.bar::-webkit-scrollbar{display:none}
.pill{flex:none;font:inherit;font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;
  padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,#ffffff 0%,#e9f7ff 48%,#cdeeff 52%,#e8f8ff 100%);
  box-shadow:0 3px 8px rgba(0,60,110,.2),inset 0 -2px 4px rgba(120,190,230,.35)}
.pill.on{color:#fff;border-color:#8fe0ff;
  background:linear-gradient(180deg,#7fd8ff 0%,#2aa7ea 48%,#0b86cf 52%,#39b8f2 100%);
  box-shadow:0 3px 10px rgba(0,80,150,.4),inset 0 1px 0 rgba(255,255,255,.7),0 0 16px rgba(120,220,255,.7)}
.pill.toys{background:linear-gradient(180deg,#e7ffcf 0%,#b8f58a 48%,#8fe25a 52%,#c5f79e 100%);color:#1f5a0a}
.pill.toys.on{color:#fff;background:linear-gradient(180deg,#a9ff6a 0%,#4fcb2a 48%,#2fae17 52%,#6fdc3f 100%)}

/* gallery */
.grid{display:flex;align-items:flex-start}
.col{flex:1;min-width:0;margin-left:14px}.col:first-child{margin-left:0}
.card{break-inside:avoid;margin:0 0 14px;position:relative;border-radius:18px;overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.75);
  box-shadow:0 10px 24px rgba(0,50,100,.28);transform:translateZ(0);transition:transform .25s}
.card:active{transform:scale(.97)}
.card img{display:block;width:100%;height:auto;background:linear-gradient(180deg,#bfe9ff,#7ccff5)}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.05) 70%,transparent)}
.heart{position:absolute;right:8px;bottom:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.8);
  display:grid;place-items:center;font-size:19px;line-height:1;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.15));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
.heart.on{background:linear-gradient(180deg,#ff9fd0,#ff3d8b 55%,#ff72ad);border-color:#ffd0e6}
.empty{text-align:center;font-weight:800;font-size:20px;padding:40px 10px;text-shadow:0 1px 3px rgba(0,60,100,.4)}

/* toys */
.toys{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.toy{position:relative;cursor:pointer;border-radius:26px;padding:22px;min-height:190px;overflow:hidden;
  border:2px solid rgba(255,255,255,.8);box-shadow:0 12px 28px rgba(0,50,100,.3);color:#fff;
  display:flex;flex-direction:column;justify-content:flex-end}
.toy::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08))}
.toy .ico{position:absolute;right:18px;top:16px;font-size:56px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.toy h3{position:relative;margin:0;font-size:26px;font-weight:900;text-shadow:0 2px 4px rgba(0,40,80,.45)}
.toy p{position:relative;margin:4px 0 0;font-weight:700;text-shadow:0 1px 3px rgba(0,40,80,.45)}
.toy:active{transform:scale(.98)}

footer{margin-top:40px;text-align:center;font-weight:700;font-size:14px;opacity:.9;text-shadow:0 1px 2px rgba(0,60,100,.4)}
footer a{color:#fff}

/* lightbox */
#lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:none;background:#021526;touch-action:none;user-select:none;-webkit-user-select:none}
#lb.open{display:block}
#lb .stage{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
#lb .stage img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;transition:opacity .9s ease}
#lb.fill .stage img{object-fit:cover}
#lb.show .stage img.cur{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
#lb .ui{transition:opacity .4s}
#lb.hideui .ui{opacity:0;pointer-events:none}
.gbtn{position:absolute;z-index:3;font:inherit;font-weight:900;font-size:17px;color:#fff;cursor:pointer;
  border-radius:999px;border:1px solid rgba(255,255,255,.75);padding:11px 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.18) 48%,rgba(255,255,255,.06) 52%,rgba(255,255,255,.2) 100%);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.gbtn.round{width:62px;height:62px;padding:0;display:grid;place-items:center}
.gbtn.round svg{width:30px;height:30px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#lbClose{top:calc(14px + env(safe-area-inset-top));left:14px}
#lbPrev{left:14px;top:50%;margin-top:-31px}
#lbNext{right:14px;top:50%;margin-top:-31px}
.lbtools{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:8px}
.lbtools .gbtn{position:static}
.gbtn.on{background:linear-gradient(180deg,#7fd8ff 0%,#2aa7ea 48%,#0b86cf 52%,#39b8f2 100%)}
#lbHeart.on{background:linear-gradient(180deg,#ff9fd0,#ff3d8b 55%,#ff72ad)}
#lbCap{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));max-width:min(92vw,760px);
  text-align:center;padding:10px 18px;border-radius:18px;font-size:13px;font-weight:700;line-height:1.35;
  background:rgba(0,30,60,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35)}
#lbCap b{font-size:16px;display:block}
#lbCap a{color:#bfeaff}

/* toy overlay */
#toyView{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:none;touch-action:none;user-select:none;-webkit-user-select:none;background:#0a4f86}
#toyView.open{display:block}
#toyView canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
#toyClose{top:calc(14px + env(safe-area-inset-top));left:14px}
#toyBtns{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
#toyBtns .gbtn{position:static}
#toyTitle{position:absolute;z-index:2;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;font-weight:900;font-size:18px;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,30,60,.6);opacity:.9}
/* chimes */
#chimes{position:absolute;top:0;right:0;bottom:0;left:0;display:none;padding:calc(90px + env(safe-area-inset-top)) 18px calc(60px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(4,1fr);gap:16px;align-content:center;justify-items:center}
#chimes.open{display:grid}
.jelly{width:min(20vw,20vh,150px);height:min(20vw,20vh,150px);border-radius:50%;border:2px solid rgba(255,255,255,.7);cursor:pointer;position:relative;
  background:radial-gradient(circle at 50% 115%,hsl(var(--h), 100%, 78%) 0,hsl(var(--h), 90%, 55%) 40%,hsl(var(--h), 85%, 34%) 100%);
  box-shadow:0 10px 24px rgba(0,30,70,.4),inset 0 -8px 18px hsla(var(--h), 100%, 80%, .6);transition:transform .08s}
.jelly::before{content:"";position:absolute;left:13%;right:13%;top:5%;height:46%;border-radius:50%/60% 60% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.08))}
.jelly.hit{animation:wob .6s}
@keyframes wob{0%{transform:scale(1)}15%{transform:scale(.85,1.12)}35%{transform:scale(1.12,.9)}55%{transform:scale(.96,1.04)}75%{transform:scale(1.02,.98)}100%{transform:scale(1)}}
.ring{position:absolute;border-radius:50%;border:3px solid hsl(var(--h), 100%, 85%);pointer-events:none;animation:ring .9s ease-out forwards;box-shadow:0 0 20px hsl(var(--h), 100%, 70%)}
@keyframes ring{from{opacity:.95;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}

@media (max-width:600px){.col{margin-left:10px}.card{margin-bottom:10px;border-radius:14px}.gbtn.round{width:52px;height:52px;margin-top:-26px}}
.bar>*+*,.lbtools>*+*,#toyBtns>*+*{margin-left:8px}
@supports (gap:1px) and (translate:none){.bar>*+*,.lbtools>*+*,#toyBtns>*+*{margin-left:0}}

.chartop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}
.chartop p{margin:6px 0;font-weight:800;text-shadow:0 1px 3px rgba(0,60,100,.4)}
.card.orig img{background:none}
#toyPanel{position:absolute;z-index:4;left:0;right:0;bottom:0;display:none}
.mk{margin:0 auto calc(10px + env(safe-area-inset-bottom));max-width:900px;display:flex;align-items:center;padding:12px;border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(220,242,255,.6));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:2px solid #fff;box-shadow:0 10px 30px rgba(0,40,90,.35)}
.mk img{width:150px;height:180px;border-radius:18px;flex:none;margin-right:12px;box-shadow:0 4px 12px rgba(0,40,90,.25)}
.mkBtns{display:flex;flex-wrap:wrap}
.mkBtns .pill{margin:4px;font-size:15px;padding:9px 14px}
.msnWrap{top:calc(80px + env(safe-area-inset-top));bottom:calc(50px + env(safe-area-inset-bottom))!important;padding:0 14px}
.msn{display:flex;height:100%;max-width:1000px;margin:0 auto;color:#12324f}
.win{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(232,246,255,.88));box-shadow:0 12px 30px rgba(0,40,90,.35)}
.win.list{width:36%;min-width:220px;margin-right:14px}
.win.chat{flex:1}
.wt{font-weight:900;color:#fff;padding:10px 14px;background:linear-gradient(180deg,#8fdcff,#2a9ee8 50%,#1580d0 51%,#4ab8f5);text-shadow:0 1px 2px rgba(0,40,90,.5)}
.me,.who{display:flex;align-items:center;padding:10px;border-bottom:1px solid #cfe6f5}
.me img,.who img{width:64px;height:70px;margin-right:10px}
.me b,.who b{display:block;font-size:18px}
.st{font-style:normal;font-weight:800;font-size:13px}
.st.on,.st.online{color:#2fae2f}.st.away{color:#e08a00}.st.busy{color:#e02828}
#blist{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.brow{display:flex;align-items:center;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:6px 10px;cursor:pointer}
.brow img{width:48px;height:52px;margin-right:10px}
.brow b{display:block}
.brow.sel{background:linear-gradient(180deg,#d8f2ff,#b0e0ff)}
#clog{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;font-size:17px;font-weight:700}
.msg{margin:0 0 10px}
.msg b{color:#1a6fd6;font-weight:800}.msg.mine b{color:#2e9e2e}
.emos{display:flex;flex-wrap:wrap;padding:8px;border-top:1px solid #cfe6f5;background:rgba(255,255,255,.6)}
.emo{font:inherit;font-size:26px;width:52px;height:52px;margin:4px;border-radius:14px;border:1px solid #fff;cursor:pointer;
  background:linear-gradient(180deg,#fff,#e2f4ff 50%,#cbeaff 51%,#e8f7ff);box-shadow:0 2px 6px rgba(0,50,100,.2)}
.emo.nudge{width:auto;padding:0 14px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ffb36b,#ff7a1a 50%,#e8600a 51%,#ff9a3c)}
.typing{color:#6a8aa8;font-style:italic;font-size:15px}
.typebar{display:flex;padding:8px;border-top:1px solid #cfe6f5;background:#fff}
.chatIn{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:700;color:#12324f;padding:10px 14px;border-radius:14px;border:2px solid #9fd6f5;outline:none;
  -webkit-user-select:text;user-select:text;background:linear-gradient(180deg,#f4fbff,#fff)}
.chatIn:focus{border-color:#2a9ee8;box-shadow:0 0 0 3px rgba(42,158,232,.25)}
.send{font:inherit;font-weight:900;font-size:17px;color:#fff;margin-left:8px;padding:0 20px;border-radius:14px;border:1px solid #8fe0ff;cursor:pointer;
  background:linear-gradient(180deg,#7fd8ff 0%,#2aa7ea 48%,#0b86cf 52%,#39b8f2 100%)}
.shake{animation:shake .5s}
@keyframes shake{10%,50%,90%{transform:translate(-10px,4px)}30%,70%{transform:translate(10px,-4px)}100%{transform:none}}
@media (max-width:700px){.msn{flex-direction:column}.win.list{width:auto;margin:0 0 10px;height:38%}.mk{flex-direction:column}.mk img{margin:0 0 8px}}
</style>
</head>
<body>
<div id="bgBubbles"></div>
<div class="wrap">
  <header>
    <div class="logo"><div class="orb"></div><h1>Aero Gallery</h1></div>
    <p class="sub">Bubbles, water, sky and shiny green things. Tap a picture to go big!</p>
  </header>
  <nav class="bar" id="bar"></nav>
  <main id="main"></main>
  <footer>All photos come from <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> under free licences. Tap any picture to see who took it.</footer>
</div>

<div id="lb">
  <div class="stage" id="lbStage"></div>
  <button class="gbtn ui" id="lbClose">✕ Back</button>
  <div class="lbtools ui">
    <button class="gbtn" id="lbFill" title="Fill the screen">Fill</button>
    <button class="gbtn" id="lbHeart">♥</button>
    <button class="gbtn" id="lbPlay">▶ Slideshow</button>
  </div>
  <button class="gbtn round ui" id="lbPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
  <button class="gbtn round ui" id="lbNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
  <div id="lbCap" class="ui"></div>
</div>

<div id="toyView">
  <canvas id="toyCanvas"></canvas>
  <div id="chimes"></div>
  <button class="gbtn" id="toyClose">✕ Back</button>
  <div id="toyBtns"></div>
  <div id="toyTitle"></div>
  <div id="toyPanel"></div>
</div>

<script src="chars.js"></script>

const CATS = ['Characters','Robot Pets','Gadgets','Bubbles & Water','Under the Sea','Blue Skies','Lagoons','Green & Growing','Up High'];
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function store0(k,d){return store.get(k,d)}
let charBase = store0('aeroCharBase', 1000);
let favs = new Set(store.get('aeroFavs',[]));
let view = store.get('aeroView','All');
let list = [];

/* ---------- background bubbles ---------- */
(function(){
  const b=$('#bgBubbles');
  for(let i=0;i<16;i++){
    const s=document.createElement('span'),z=20+Math.random()*70;
    s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${14+Math.random()*18}s;animation-delay:${-Math.random()*30}s;--dx:${(Math.random()-.5)*160}px;opacity:${.5+Math.random()*.5}`;
    b.appendChild(s);
  }
})();

/* ---------- nav ---------- */
function buildBar(){
  const tabs=['All',...CATS,'♥ Favourites','Toys'];
  $('#bar').innerHTML=tabs.map(t=>`<button class="pill${t==='Toys'?' toys':''}${t===view?' on':''}" data-t="${t}">${t==='Toys'?'🫧 Toys':t}</button>`).join('');
}
$('#bar').addEventListener('click',e=>{
  const b=e.target.closest('.pill'); if(!b)return;
  view=b.dataset.t; store.set('aeroView',view); buildBar(); render();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ---------- gallery ---------- */
function render(){
  const main=$('#main');
  if(view==='Toys'){ main.innerHTML=toysHTML(); return; }
  let top='';
  if(view==='Characters'){ list=charSet(charBase); top='<div class="chartop"><p>Original characters drawn just for this gallery. There are millions of them!</p><button class="pill toys" id="shuffle">🔀 Show me new ones</button></div>'; }
  else if(view==='All'){ const ch=charSet(charBase+7); list=[]; ITEMS.forEach((it,n)=>{ list.push(it); if(n%4===3&&ch.length) list.push(ch.shift()); }); }
  else if(view==='♥ Favourites'){ list=ITEMS.filter(i=>favs.has(i.id)); [...favs].forEach(id=>{ if(id.indexOf('c-')===0){ const c=charFromId(id); if(c) list.unshift(c); } }); }
  else list=ITEMS.filter(i=>i.cat===view);
  if(!list.length){ main.innerHTML=`<div class="empty">No favourites yet!<br>Tap the ♥ on any picture to keep it here.</div>`; return; }
  const ncol=colCount(), cols=[], hs=[];
  for(let c=0;c<ncol;c++){cols.push('');hs.push(0);}
  list.forEach((it,n)=>{
    let c=0; for(let k=1;k<ncol;k++) if(hs[k]<hs[c]-1) c=k;
    hs[c]+=it.h/it.w+.08;
    cols[c]+=`<div class="card${it.original?' orig':''}" data-n="${n}"><img loading="lazy" src="${it.src||'img/thumb/'+it.id+'.jpg'}" width="${it.w}" height="${it.h}" alt="${esc(it.title)}">
     <button class="heart${favs.has(it.id)?' on':''}" data-id="${it.id}" aria-label="Favourite">♥</button></div>`;
  });
  main.innerHTML=top+'<div class="grid">'+cols.map(c=>'<div class="col">'+c+'</div>').join('')+'</div>';
}

let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function pop(pitch=1){
  const a=ac(); if(!a)return; const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(900*pitch,t); o.frequency.exponentialRampToValueAtTime(220*pitch,t+.08);
  g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+.13);
}
function bell(freq,vol=.25){
  const a=ac(); if(!a)return; const t=a.currentTime;
  const out=a.createGain(); out.gain.value=vol; out.connect(a.destination);
  [[1,1,2.6],[2.01,.45,1.6],[3.0,.22,1.0],[4.2,.12,.6]].forEach(([m,v,d])=>{
    const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=freq*m;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.0005,t+d);
    o.connect(g).connect(out); o.start(t); o.stop(t+d+.05);
  });
}
function blub(){
  const a=ac(); if(!a)return; const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain(); o.type='sine';
  const f=300+Math.random()*300; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.2,t+.09);
  g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+.13);
}

/* ---- Bubble Pop ---- */
bubbles(){

  const bokeh=[...Array(22)].map(()=>({x:Math.random(),y:Math.random(),r:rnd(20,90),h:rnd(170,210),s:rnd(.05,.2)}));

    count++; pop(1.3-b.r/120);
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2,s=rnd(80,220);bits.push({x:b.x+Math.cos(a)*b.r*.8,y:b.y+Math.sin(a)*b.r*.8,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:b.hue+i*20})}
  }
  onPtr((x,y)=>{
    for(let i=bs.length-1;i>=0;i--){const b=bs[i]; if((b.x-x)**2+(b.y-y)**2<(b.r+14)**2){burst(b);bs.splice(i,1);return}}
  },(x,y)=>{
    for(let i=bs.length-1;i>=0;i--){const b=bs[i]; if((b.x-x)**2+(b.y-y)**2<b.r**2){burst(b);bs.splice(i,1)}}
  });

    init(){for(let i=0;i<10;i++)add(rnd(0,H))},

      for(const k of bokeh){cx.fillStyle=`hsla(${k.h},100%,90%,${k.s})`;cx.beginPath();cx.arc(k.x*W,((k.y-t*.01)%1+1)%1*H,k.r,0,7);cx.fill()}

        cx.strokeStyle=`hsla(${b.hue+200},100%,85%,.5)`; cx.lineWidth=1.5; cx.beginPath(); cx.arc(x,y,b.r*.96,.2,2.2); cx.stroke();
        cx.fillStyle='rgba(255,255,255,.85)'; cx.beginPath(); cx.ellipse(x-b.r*.38,y-b.r*.42,b.r*.22,b.r*.12,-.7,0,7); cx.fill();

      }

      cx.restore();
      // sand
      g=cx.createLinearGradient(0,H*.86,0,H); g.addColorStop(0,'#f6e6b0'); g.addColorStop(1,'#d9b877');

      for(const f of fishes){
        let tx=f.tx, ty=f.ty;
        if(food.length){ let best=null,bd=1e9; for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2; if(d<bd){bd=d;best=p}} tx=best.x; ty=best.y;
          if(bd<18*18*f.s){ food.splice(food.indexOf(best),1); f.s=Math.min(1.8,f.s+.03); bub.push({x:f.x,y:f.y,r:3,v:60}); blub(); } }
        else if(Math.hypot(tx-f.x,ty-f.y)<30){ f.tx=rnd(40,W-40); f.ty=rnd(H*.12,H*.8); }
        const a=Math.atan2(ty-f.y,tx-f.x), sp=food.length?150:55;
        f.vx+=(Math.cos(a)*sp-f.vx)*dt*1.4; f.vy+=(Math.sin(a)*sp*.6-f.vy)*dt*1.4;
        f.x+=f.vx*dt; f.y+=f.vy*dt; f.x=Math.max(20,Math.min(W-20,f.x)); f.y=Math.max(30,Math.min(H*.86,f.y));
        if(Math.abs(f.vx)>6) f.dir=f.vx>0?1:-1; f.zoom=Math.max(0,f.zoom-dt);
        if(Math.random()<dt*.3) bub.push({x:f.x+f.dir*25*f.s,y:f.y,r:rnd(2,5),v:rnd(30,60)});
        drawFish(f,t);
      }
      // bubbles
      if(Math.random()<dt*3) bub.push({x:W*rnd(.05,.95),y:H*.92,r:rnd(2,7),v:rnd(40,90)});
      for(let i=bub.length-1;i>=0;i--){const b=bub[i]; b.y-=b.v*dt; b.x+=Math.sin(b.y*.05)*.4; if(b.y<-10){bub.splice(i,1);continue}
        cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=1.3; cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.stroke();
        cx.fillStyle='rgba(255,255,255,.8)'; cx.beginPath(); cx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.3,0,7); cx.fill();}
    }
  };
},

/* ---- Shiny Orbs ---- */
orbs(){
  const orbs=[]; let hue=190, dragging=null, spawnT=0;
  function add(x,y){ const r=rnd(22,46); orbs.push({x,y,vx:rnd(-60,60),vy:0,r,h:hue}); hue=(hue+23)%360; if(orbs.length>70)orbs.shift(); }
  function hillY(x){ return H*.78 - Math.sin(x/W*Math.PI)*H*.12; }
  onPtr((x,y)=>{
    for(const o of orbs){ if(Math.hypot(o.x-x,o.y-y)<o.r){ dragging=o; o.vx=o.vy=0; return; } }
    add(x,y); pop(.8); dragging=null; spawnT=0;
  },(x,y,id,prev)=>{
    if(dragging){ dragging.vx=(x-prev[0])*50; dragging.vy=(y-prev[1])*50; dragging.x=x; dragging.y=y; }
    else { spawnT++; if(spawnT%6===0){add(x,y)} }
  },()=>{dragging=null});
  addBtn('Clear',()=>{orbs.length=0});
  addBtn('Rain orbs',()=>{for(let i=0;i<14;i++)setTimeout(()=>add(rnd(40,W-40),-40),i*90)});
  let lastBonk=0;
  return{
    frame(dt,t){
      skyBG('#0a6cc0','#48b4ef','#d6f5ff'); sunGlow(W*.2,H*.1,Math.max(W,H)*.5);
      // clouds
      cx.fillStyle='rgba(255,255,255,.85)';
      for(let i=0;i<4;i++){const cxp=((i*.3+t*.01)%1.3-.15)*W, cyp=H*(.12+i*.06); [[0,0,24],[26,-14,30],[56,-6,28],[82,4,20],[40,8,26],[14,10,20],[68,10,20]].forEach(([a,b,r])=>{cx.beginPath();cx.arc(cxp+a,cyp+b,r,0,7);cx.fill()})}
      // hill (Bliss-ish)
      let g=cx.createLinearGradient(0,H*.6,0,H); g.addColorStop(0,'#8fe04a'); g.addColorStop(.4,'#4bb52c'); g.addColorStop(1,'#1f7a1a');
      cx.fillStyle=g; cx.beginPath(); cx.moveTo(0,H); for(let x=0;x<=W+10;x+=10)cx.lineTo(x,hillY(x)); cx.lineTo(W+10,H); cx.fill();
      cx.strokeStyle='rgba(220,255,160,.6)'; cx.lineWidth=3; cx.beginPath(); for(let x=0;x<=W+10;x+=10)cx.lineTo(x,hillY(x)); cx.stroke();
      // physics (sub-steps)
      const n=3, h=dt/n;
      for(let s=0;s<n;s++){
        for(const o of orbs){ if(o===dragging)continue; o.vy+=900*h; o.x+=o.vx*h; o.y+=o.vy*h;
          if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)*.7} if(o.x>W-o.r){o.x=W-o.r;o.vx=-Math.abs(o.vx)*.7}
          const gy=hillY(o.x); if(o.y+o.r>gy){ o.y=gy-o.r; const slope=(hillY(o.x+2)-hillY(o.x-2))/4; if(o.vy>200&&performance.now()-lastBonk>60){bell(300+o.h*2,.05);lastBonk=performance.now()} o.vy=-Math.abs(o.vy)*.55; o.vx+= slope*260*h*10; o.vx*=.995; } }
        for(let i=0;i<orbs.length;i++)for(let j=i+1;j<orbs.length;j++){const a=orbs[i],b=orbs[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
          if(d<m&&d>0){const nx=dx/d,ny=dy/d,ov=(m-d)/2; a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
            const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv<0){const imp=-rv*.8; a.vx-=nx*imp/2;a.vy-=ny*imp/2;b.vx+=nx*imp/2;b.vy+=ny*imp/2}}}
      }
      for(const o of orbs){ // shadow
        cx.fillStyle='rgba(0,50,0,.18)'; cx.beginPath(); cx.ellipse(o.x,hillY(o.x),o.r*.9,o.r*.2,0,0,7); cx.fill(); }
      for(const o of orbs) glossyBall(o.x,o.y,o.r,o.h);
      if(!orbs.length){ cx.font='900 24px Nunito,sans-serif'; cx.textAlign='center'; cx.fillStyle='#fff'; cx.shadowColor='rgba(0,40,90,.5)'; cx.shadowBlur=8; cx.fillText('Tap or drag anywhere to make orbs',W/2,H*.45); cx.shadowBlur=0; }
    }
  };
},

/* ---- Ripple Pond ---- */
ripple(){
  let picI=0, img=new Image(), sw=0, sh=0, cur, prev, tex=null, out=null, off=document.createElement('canvas'), oc=off.getContext('2d');
  function setup(){
    sw=Math.max(200,Math.round(W/2.2)); sh=Math.max(150,Math.round(H/2.2));
    off.width=sw; off.height=sh; cur=new Float32Array(sw*sh); prev=new Float32Array(sw*sh);
    if(img.complete&&img.naturalWidth){ const r=Math.max(sw/img.naturalWidth,sh/img.naturalHeight), iw=img.naturalWidth*r, ih=img.naturalHeight*r;
      oc.drawImage(img,(sw-iw)/2,(sh-ih)/2,iw,ih); tex=oc.getImageData(0,0,sw,sh); out=oc.createImageData(sw,sh); }
  }
  function load(){ img=new Image(); img.onload=setup; img.src=`img/full/${RIPPLE_PICS[picI]}.jpg`; }
  function drop(x,y,s=260,rad=3){ const gx=Math.round(x/W*sw), gy=Math.round(y/H*sh);
    for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++){const X=gx+i,Y=gy+j; if(X>0&&Y>0&&X<sw-1&&Y<sh-1&&i*i+j*j<=rad*rad) prev[Y*sw+X]+=s;} }
  let lastSnd=0;
  onPtr((x,y)=>{drop(x,y,500,4); blub()},(x,y)=>{drop(x,y,180,3); if(performance.now()-lastSnd>180){lastSnd=performance.now(); if(Math.random()<.5)blub()}});
  addBtn('New picture',()=>{picI=(picI+1)%RIPPLE_PICS.length; load()});
  addBtn('Rain',b=>{rain=!rain;b.classList.toggle('on',rain)});
  let rain=false;
  return{
    init(){ load(); },
    resize(){ if(img.complete) setup(); },
    frame(dt,t){
      if(!tex){ cx.fillStyle='#0a6fa0'; cx.fillRect(0,0,W,H); return; }
      if(rain&&Math.random()<.5) drop(rnd(0,W),rnd(0,H),220,2);
      if(Math.random()<.01) drop(rnd(0,W),rnd(0,H),200,2);
      // wave step
      for(let y=1;y<sh-1;y++){ const r=y*sw; for(let x=1;x<sw-1;x++){ const i=r+x;
        cur[i]=((prev[i-1]+prev[i+1]+prev[i-sw]+prev[i+sw])/2-cur[i])*.975; } }
      const tmp=prev; prev=cur; cur=tmp;
      const d=tex.data, o=out.data;
      for(let y=1;y<sh-1;y++){ const r=y*sw; for(let x=1;x<sw-1;x++){ const i=r+x;
        const dx=prev[i-1]-prev[i+1], dy=prev[i-sw]-prev[i+sw];
        let sx=x+(dx>>3), sy=y+(dy>>3); if(sx<0)sx=0; else if(sx>=sw)sx=sw-1; if(sy<0)sy=0; else if(sy>=sh)sy=sh-1;
        const si=(sy*sw+sx)*4, oi=i*4, sh2=dx*.25;
        o[oi]=d[si]+sh2; o[oi+1]=d[si+1]+sh2; o[oi+2]=d[si+2]+sh2; o[oi+3]=255; } }
      oc.putImageData(out,0,0);
      cx.imageSmoothingEnabled=true; cx.drawImage(off,1,1,sw-2,sh-2,0,0,W,H);
      // gloss
      const g=cx.createLinearGradient(0,0,0,H*.4); g.addColorStop(0,'rgba(255,255,255,.18)'); g.addColorStop(1,'rgba(255,255,255,0)'); cx.fillStyle=g; cx.fillRect(0,0,W,H*.4);
    }
  };
},

/* ---- Glass Chimes (DOM) ---- */
chimes(){
  cv.style.display='none';
  const box=$('#chimes'); box.innerHTML=''; box.classList.add('open');
  tv.style.background='radial-gradient(900px 600px at 50% 0%,#bff0ff,transparent 60%),linear-gradient(180deg,#2a8ee0,#0b4f9a)';
  const notes=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880,1046.5,1174.7];
  notes.forEach((f,i)=>{
    const j=document.createElement('button'); j.className='jelly'; j.style.setProperty('--h',(i*30+170)%360);
    const hit=e=>{ e.preventDefault(); bell(f); j.classList.remove('hit'); void j.offsetWidth; j.classList.add('hit');
      const r=document.createElement('div'); r.className='ring'; r.style.setProperty('--h',(i*30+170)%360);
      const b=j.getBoundingClientRect(); r.style.left=(b.left+b.width/2)+'px'; r.style.top=(b.top+b.height/2)+'px'; r.style.width=r.style.height=b.width+'px';
      tv.appendChild(r); setTimeout(()=>r.remove(),950); };
    j.addEventListener(window.PointerEvent?'pointerdown':'touchstart',hit); j._hit=hit;
    box.appendChild(j);
  });
  addBtn('Play a tune',()=>{ const tune=[0,2,4,7,4,2,0,4,7,9,11,9,7]; tune.forEach((n,k)=>setTimeout(()=>box.children[n]&&box.children[n]._hit({preventDefault(){}}),k*260)); });
  return{ stop(){ box.classList.remove('open'); box.innerHTML=''; tv.style.background=''; cv.style.display=''; } };
},

/* ---- Cloud Painter ---- */
sky(){
  const puffs=[]; let sun=true;
  function puff(x,y){ puffs.push({x,y,r:rnd(18,40),a:0,vx:rnd(6,14)}); if(puffs.length>900)puffs.shift(); }
  onPtr((x,y)=>{for(let i=0;i<5;i++)puff(x+rnd(-20,20),y+rnd(-12,12))},(x,y,id,p)=>{const d=Math.hypot(x-p[0],y-p[1]);for(let k=0;k<d;k+=10)puff(p[0]+(x-p[0])*k/d+rnd(-14,14),p[1]+(y-p[1])*k/d+rnd(-10,10))});
  addBtn('Clear sky',()=>{puffs.length=0});
  addBtn('Windy',b=>{wind=wind?0:1;b.classList.toggle('on',!!wind)});
  let wind=0;
  return{
    frame(dt,t){
      skyBG('#0960b8','#3aa6ec','#c9f1ff'); sunGlow(W*.85,H*.15,Math.max(W,H)*.55);
      // lens flare
      cx.save(); cx.globalCompositeOperation='lighter';
      [[.55,.4,40,'rgba(160,255,220,.08)'],[.35,.62,22,'rgba(160,200,255,.1)'],[.2,.8,60,'rgba(200,255,180,.06)']].forEach(([fx,fy,r,c])=>{cx.fillStyle=c;cx.beginPath();cx.arc(W*.85+(W*.5-W*.85)*fx*2.2,H*.15+(H*.5-H*.15)*fy*2.2,r,0,7);cx.fill()});
      cx.restore();
      // grass
      let g=cx.createLinearGradient(0,H*.82,0,H); g.addColorStop(0,'#9ee85a'); g.addColorStop(1,'#2e8f22');
      cx.fillStyle=g; cx.beginPath(); cx.moveTo(0,H); cx.lineTo(0,H*.88); cx.quadraticCurveTo(W*.35,H*.78,W*.6,H*.86); cx.quadraticCurveTo(W*.85,H*.93,W,H*.84); cx.lineTo(W,H); cx.fill();
      // clouds: shadow layer then white layer
      for(const p of puffs){ p.a=Math.min(1,p.a+dt*3); p.x+=p.vx*dt*(wind?8:1); if(p.x-p.r>W)p.x=-p.r*2; }
      cx.fillStyle='rgba(150,190,225,.35)';
      for(const p of puffs){cx.beginPath();cx.arc(p.x+3,p.y+p.r*.35,p.r*p.a,0,7);cx.fill()}
      for(const p of puffs){ const gr=cx.createRadialGradient(p.x-p.r*.2,p.y-p.r*.3,p.r*.1,p.x,p.y,p.r*p.a); gr.addColorStop(0,'#ffffff'); gr.addColorStop(.7,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(235,245,255,.0)');
        cx.fillStyle=gr; cx.beginPath(); cx.arc(p.x,p.y,p.r*p.a,0,7); cx.fill(); }
      if(!puffs.length){ cx.font='900 24px Nunito,sans-serif'; cx.textAlign='center'; cx.fillStyle='#fff'; cx.shadowColor='rgba(0,40,90,.5)'; cx.shadowBlur=8; cx.fillText('Drag your finger to paint clouds',W/2,H*.45); cx.shadowBlur=0; }
    }
  };
},
};
const RIPPLE_PICS = ["024", "038", "070", "089"];
Object.assign(TOYIMPL, CHAR_TOYIMPL);

buildBar(); render();

  if(h.startsWith('toy-')&&TOYS.some(t=>t.id===h.slice(4))) openToy(h.slice(4));
  else if(h.startsWith('photo-')){view='All';buildBar();render();const n=list.findIndex(i=>i.id===h.slice(6));if(n>=0)openLB(n);}
}
fromHash(); window.addEventListener('hashchange',fromHash);
